<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hermes</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#065F46" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hermes" />
  <link rel="apple-touch-icon" href="/hermes-logo-corpo.svg" />

  <!-- Material Design Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { scale: { '98': '0.98' }, borderWidth: { '1.5': '1.5px' } } }
    }
  </script>

  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    @keyframes sheetUp    { from { transform: translateY(100%); }                                             to { transform: translateY(0); } }
    @keyframes fadeIn     { from { opacity: 0; }                                                              to { opacity: 1; } }
    @keyframes slideUp    { from { opacity: 0; transform: translateY(12px); }                                 to { opacity: 1; transform: translateY(0); } }
    @keyframes xpFloat    { 0%  { opacity:0; transform:translateX(-50%) translateY(8px)  scale(0.85); }
                            15% { opacity:1; transform:translateX(-50%) translateY(0px)  scale(1.05); }
                            75% { opacity:1; transform:translateX(-50%) translateY(-4px) scale(1);    }
                           100% { opacity:0; transform:translateX(-50%) translateY(-12px) scale(0.95);} }
    @keyframes spin       { to { transform: rotate(360deg); } }
    @keyframes slideUpFade{ from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes logoPulse  { 0%,100% { opacity:0.7; } 50% { opacity:1; } }

    .anim-sheet    { animation: sheetUp    0.32s cubic-bezier(0.32,0.72,0,1) both; }
    .anim-overlay  { animation: fadeIn     0.2s  ease-out both; }
    .anim-card     { animation: slideUp    0.25s ease-out both; }
    .anim-xp       { animation: xpFloat   2.6s  ease-out forwards; }
    .anim-spin     { animation: spin       0.8s  linear infinite; }
    .anim-slide-up { animation: slideUpFade 0.22s ease-out both; }
    .anim-logo     { animation: logoPulse  2s    ease-in-out infinite; }
    .anim-highlight{ animation: ringPulse 0.9s  ease-out 2; }

    @keyframes ringPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } 50% { box-shadow: 0 0 0 6px rgba(16,185,129,0.35); } }

    /* MDI icon vertical alignment */
    .mdi { line-height: 1; }
  </style>
</head>
<body style="background:#F9FAFB">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ─────────────────────────────────────────────
   CONSTANTES
───────────────────────────────────────────── */
const OPCOES_REPORTE = [
  { id: 'disponivel',   label: 'Está recebendo',            desc: 'Médico presente e atendendo normalmente',   xp: 10, icon: 'mdi-check-circle-outline',    bg: 'bg-green-50',  border: 'border-green-200',  titleCls: 'text-green-800',  descCls: 'text-green-600',  iconCls: 'text-green-500',  badgeCls: 'bg-green-100 text-green-700'   },
  { id: 'atrasado',     label: 'Está atrasado',             desc: 'Presente mas com atraso no atendimento',    xp: 15, icon: 'mdi-clock-alert-outline',       bg: 'bg-yellow-50', border: 'border-yellow-200', titleCls: 'text-yellow-800', descCls: 'text-yellow-600', iconCls: 'text-yellow-500', badgeCls: 'bg-yellow-100 text-yellow-700' },
  { id: 'indisponivel', label: 'Não está atendendo',        desc: 'Ausente, cancelou ou não vai atender hoje', xp: 20, icon: 'mdi-close-circle-outline',      bg: 'bg-red-50',    border: 'border-red-200',    titleCls: 'text-red-800',    descCls: 'text-red-600',    iconCls: 'text-red-500',    badgeCls: 'bg-red-100 text-red-700'       },
  { id: 'nao_trabalha', label: 'Não trabalha mais aqui',    desc: 'Médico mudou de clínica ou foi desligado',  xp: 25, icon: 'mdi-account-remove-outline',   bg: 'bg-orange-50', border: 'border-orange-200', titleCls: 'text-orange-800', descCls: 'text-orange-600', iconCls: 'text-orange-500', badgeCls: 'bg-orange-100 text-orange-700' },
  { id: 'endereco',     label: 'Endereço incorreto / novo', desc: 'Consultório mudou ou encontrei novo local',  xp: 30, icon: 'mdi-map-marker-plus-outline',  bg: 'bg-blue-50',   border: 'border-blue-200',   titleCls: 'text-blue-800',   descCls: 'text-blue-600',   iconCls: 'text-blue-500',   badgeCls: 'bg-blue-100 text-blue-700'     },
];

const STATUS_CFG = {
  disponivel:   { label: 'Recebendo',    icon: 'mdi-check-circle',       bg: 'bg-green-50',  text: 'text-green-700',  border: 'border-green-200',  bar: 'bg-green-500'  },
  atrasado:     { label: 'Atrasado',     icon: 'mdi-clock-alert-outline', bg: 'bg-yellow-50', text: 'text-yellow-700', border: 'border-yellow-200', bar: 'bg-yellow-500' },
  indisponivel: { label: 'Indisponível', icon: 'mdi-close-circle',        bg: 'bg-red-50',    text: 'text-red-700',    border: 'border-red-200',    bar: 'bg-red-500'    },
};

const FEED_ICON = {
  disponivel:   'mdi-check-circle text-green-500',
  atrasado:     'mdi-clock-alert-outline text-yellow-500',
  indisponivel: 'mdi-close-circle text-red-500',
  nao_trabalha: 'mdi-account-remove-outline text-orange-500',
  endereco:     'mdi-map-marker text-blue-500',
};

const ABAS = [
  { id: 'medicos',  label: 'Médicos',  icon: 'mdi-stethoscope'        },
  { id: 'feed',     label: 'Feed',     icon: 'mdi-broadcast'          },
  { id: 'ranking',  label: 'Ranking',  icon: 'mdi-trophy-outline'     },
  { id: 'perfil',   label: 'Perfil',   icon: 'mdi-account-outline'    },
  { id: 'admin',    label: 'Admin',    icon: 'mdi-cloud-upload-outline'},
];

const FILTROS = [
  { id: 'todos',       label: 'Todos'       },
  { id: 'disponiveis', label: 'Disponíveis' },
  { id: 'alertas',     label: 'Com Alertas' },
];

const DIAS_SEMANA = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

const HORARIOS_PRESET = [
  { id: 'manha',   label: 'Manhã',    sub: '08h–12h',  value: '08h–12h'            },
  { id: 'tarde',   label: 'Tarde',    sub: '13h–18h',  value: '13h–18h'            },
  { id: 'diatodo', label: 'Dia todo', sub: '08h–18h',  value: '08h–12h / 14h–18h' },
  { id: 'custom',  label: 'Outro',    sub: 'digitar',  value: null                 },
];

/* ─────────────────────────────────────────────
   COMPONENTES
───────────────────────────────────────────── */

function StatusBadge({ status }) {
  const s = STATUS_CFG[status] || STATUS_CFG.indisponivel;
  return (
    <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold border ${s.bg} ${s.text} ${s.border} shrink-0`}>
      <i className={`mdi ${s.icon} text-sm`} aria-hidden="true" />
      {s.label}
    </span>
  );
}

function MedicoCard({ medico, onReportar, destacado, apelido, onConfirmarLocal }) {
  const s = STATUS_CFG[medico.status] || STATUS_CFG.indisponivel;
  const iniciais = medico.nome.split(' ').filter(p => p.length > 2).slice(0, 2).map(p => p[0]).join('');

  return (
    <div id={`medico-${medico.id}`} className={`bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden anim-card${destacado ? ' anim-highlight' : ''}`}>
      <div className={`h-1 w-full ${s.bar}`} />
      <div className="p-4">
        <div className="flex items-start gap-3 mb-3">
          <div className="w-11 h-11 rounded-xl bg-gray-100 flex items-center justify-center shrink-0 border border-gray-200">
            <span className="font-black text-sm text-gray-500">{iniciais}</span>
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <p className="font-bold text-gray-900 text-sm leading-tight truncate">{medico.nome}</p>
                <p className="text-emerald-600 font-semibold text-xs mt-0.5">{medico.especialidade}</p>
                <p className="text-gray-400 text-xs">{medico.crm}</p>
              </div>
              <StatusBadge status={medico.status} />
            </div>
          </div>
        </div>

        <div className="bg-gray-50 rounded-xl p-3 mb-3 border border-gray-100">
          {medico.locais.map((local, idx) => (
            <div key={local.id}>
              {idx > 0 && <div className="border-t border-gray-200 my-2" />}
              <div className="flex items-start gap-2">
                <i className="mdi mdi-map-marker text-emerald-500 text-base shrink-0 mt-px" aria-hidden="true" />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <p className="text-xs text-gray-600 leading-snug">{local.endereco}</p>
                    {idx === 0 && medico.locais.length > 1 && (
                      <span className="inline-flex items-center gap-0.5 text-[9px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full px-1.5 py-0.5 shrink-0">
                        <i className="mdi mdi-star text-[9px]" aria-hidden="true" /> Mais recente
                      </span>
                    )}
                  </div>
                  {(local.bairro || local.cidade) && (
                    <p className="text-[11px] text-gray-400 leading-snug mt-0.5">
                      {[local.bairro, local.cidade].filter(Boolean).join(' · ')}
                    </p>
                  )}
                  <p className="text-xs font-semibold text-emerald-700 mt-0.5">{local.dias} · {local.horario}</p>
                  <div className="flex items-center gap-2 mt-1 flex-wrap">
                    {local.diasVerif > 60 ? (
                      <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-orange-600 bg-orange-50 border border-orange-200 rounded-full px-2 py-0.5">
                        <i className="mdi mdi-alert-circle-outline text-xs" aria-hidden="true" /> Verificação pendente
                      </span>
                    ) : local.verificado ? (
                      <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-green-600 bg-green-50 border border-green-200 rounded-full px-2 py-0.5">
                        <i className="mdi mdi-check-decagram text-xs" aria-hidden="true" /> Verificado
                      </span>
                    ) : null}
                    {local.adicionadoEm && (
                      <span className="text-[10px] text-gray-400">adicionado {local.adicionadoEm}</span>
                    )}
                  </div>
                  {(local.telefone || local.secretaria) && (
                    <div className="flex items-center gap-3 mt-1.5 flex-wrap">
                      {local.telefone && (
                        <span className="inline-flex items-center gap-1 text-[11px] text-gray-500">
                          <i className="mdi mdi-phone-outline text-gray-400 text-xs" aria-hidden="true" />
                          {mascaraTelefone(local.telefone)}
                        </span>
                      )}
                      {local.secretaria && (
                        <span className="inline-flex items-center gap-1 text-[11px] text-gray-500">
                          <i className="mdi mdi-account-outline text-gray-400 text-xs" aria-hidden="true" />
                          {local.secretaria}
                        </span>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          ))}
        </div>

        {medico.locaisPendentes && medico.locaisPendentes.length > 0 && (
          <div className="mb-3 space-y-2">
            {medico.locaisPendentes.map(lp => {
              const euSugeri = lp.propostoPor === apelido;
              const jaConfirmei = (lp.confirmados || []).includes(apelido);
              const progresso = Math.min(1, lp.confirmacoes / lp.threshold);
              return (
                <div key={lp.id} className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                  <div className="flex items-center gap-1.5 mb-1.5">
                    <i className="mdi mdi-clock-outline text-amber-500 text-xs" aria-hidden="true" />
                    <span className="text-[10px] font-bold text-amber-600 uppercase tracking-wide">Aguardando confirmação</span>
                  </div>
                  <p className="text-xs text-gray-700 leading-snug mb-0.5">{lp.endereco}</p>
                  {(lp.bairro || lp.cidade) && (
                    <p className="text-[11px] text-gray-400 leading-snug mb-0.5">
                      {[lp.bairro, lp.cidade].filter(Boolean).join(' · ')}
                    </p>
                  )}
                  <p className="text-xs font-semibold text-emerald-700">{lp.dias} · {lp.horario}</p>
                  {(lp.telefone || lp.secretaria) && (
                    <div className="flex items-center gap-3 mt-1 flex-wrap">
                      {lp.telefone && (
                        <span className="inline-flex items-center gap-1 text-[11px] text-gray-500">
                          <i className="mdi mdi-phone-outline text-gray-400 text-xs" aria-hidden="true" />
                          {mascaraTelefone(lp.telefone)}
                        </span>
                      )}
                      {lp.secretaria && (
                        <span className="inline-flex items-center gap-1 text-[11px] text-gray-500">
                          <i className="mdi mdi-account-outline text-gray-400 text-xs" aria-hidden="true" />
                          {lp.secretaria}
                        </span>
                      )}
                    </div>
                  )}
                  <div className="flex items-center gap-2 mt-2">
                    <div className="flex-1 bg-amber-100 rounded-full h-1.5">
                      <div className="bg-amber-400 h-1.5 rounded-full transition-all duration-500"
                        style={{ width: `${progresso * 100}%` }} />
                    </div>
                    <span className="text-[11px] font-bold text-amber-600 whitespace-nowrap shrink-0">
                      {lp.confirmacoes}/{lp.threshold}
                    </span>
                    {euSugeri ? (
                      <span className="text-[10px] text-gray-400 shrink-0">Você sugeriu</span>
                    ) : jaConfirmei ? (
                      <span className="inline-flex items-center gap-0.5 text-[10px] font-bold text-green-600 shrink-0">
                        <i className="mdi mdi-check text-xs" aria-hidden="true" /> Confirmado
                      </span>
                    ) : (
                      <button onClick={() => onConfirmarLocal(lp.id)}
                        className="inline-flex items-center gap-1 text-[11px] font-bold text-white bg-amber-500 active:scale-95 px-2.5 py-1.5 rounded-lg transition-transform shrink-0">
                        <i className="mdi mdi-check text-xs" aria-hidden="true" /> Confirmar
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div className="flex items-center justify-between">
          <p className="text-xs text-gray-400 leading-tight">
            <span className="font-medium text-gray-500">{medico.reportadoPor}</span>
            {' · '}{medico.ultimoReporte}
            {' · '}{medico.totalReportes} reportes
          </p>
          <button onClick={() => onReportar(medico)}
            className="inline-flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition-all duration-150 shadow-sm shrink-0">
            <i className="mdi mdi-plus-circle-outline text-sm" aria-hidden="true" />
            Reportar
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Bottom sheet de reporte com 2 passos ── */
const TIPOS_LOGRADOURO = ['Rua', 'Avenida', 'Alameda', 'Travessa', 'Praça', 'Rodovia', 'Estrada', 'Boulevard'];

function mascaraTelefone(v) {
  const d = v.replace(/\D/g, '').slice(0, 11);
  if (d.length === 0) return '';
  if (d.length <= 2)  return `(${d}`;
  if (d.length <= 6)  return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}

function mascaraNumeroEnd(v) {
  return v.replace(/[^0-9A-Za-z\/]/g, '').slice(0, 8).toUpperCase();
}

function mascaraCep(v) {
  const d = v.replace(/\D/g, '').slice(0, 8);
  return d.length <= 5 ? d : `${d.slice(0, 5)}-${d.slice(5)}`;
}

function PainelReporte({ medico, onFechar, onConfirmar, onAdicionarLocal, opcoesCidades, opcoesBairros }) {
  const [passo, setPasso]           = useState('opcoes');
  const [tipoLog, setTipoLog]       = useState('Rua');
  const [nomeRua, setNomeRua]       = useState('');
  const [numEnd, setNumEnd]         = useState('');
  const [compEnd, setCompEnd]       = useState('');
  const [bairroEnd, setBairroEnd]   = useState('');
  const [cidadeEnd, setCidadeEnd]   = useState('');
  const [cep, setCep]               = useState('');
  const [cepCarregando, setCepCarregando] = useState(false);
  const [cepErro, setCepErro]       = useState('');
  const [telefoneEnd, setTelefoneEnd] = useState('');
  const [secretariaEnd, setSecretariaEnd] = useState('');
  const [diasSel, setDiasSel]       = useState([]);
  const [horPreset, setHorPreset]   = useState('');
  const [horCustom, setHorCustom]   = useState('');
  const [swipeX, setSwipeX]         = useState(0);
  const [isDragging, setIsDragging] = useState(false);
  const touchRef = useRef({ startX: 0, startY: 0, lockH: false, lockV: false });

  const resetEndereco = () => {
    setTipoLog('Rua'); setNomeRua(''); setNumEnd(''); setCompEnd('');
    setBairroEnd(''); setCidadeEnd(''); setCep(''); setCepErro('');
    setTelefoneEnd(''); setSecretariaEnd('');
    setDiasSel([]); setHorPreset(''); setHorCustom('');
  };

  const handleCep = async (v) => {
    const masked = mascaraCep(v);
    setCep(masked);
    setCepErro('');
    const digits = masked.replace(/\D/g, '');
    if (digits.length === 8) {
      setCepCarregando(true);
      try {
        const data = await fetch(`https://viacep.com.br/ws/${digits}/json/`).then(r => r.json());
        if (data.erro) {
          setCepErro('CEP não encontrado');
        } else {
          let tipo = 'Rua';
          let rua = data.logradouro || '';
          for (const t of TIPOS_LOGRADOURO) {
            if (rua.toLowerCase().startsWith(t.toLowerCase())) {
              tipo = t;
              rua = rua.slice(t.length).trim().replace(/^[,.\s]+/, '');
              break;
            }
          }
          setTipoLog(tipo);
          setNomeRua(rua);
          setBairroEnd(data.bairro || '');
          setCidadeEnd(data.localidade || '');
        }
      } catch {
        setCepErro('Erro ao buscar CEP');
      } finally {
        setCepCarregando(false);
      }
    }
  };

  useEffect(() => {
    if (!medico) { setPasso('opcoes'); resetEndereco(); }
  }, [medico]);

  if (!medico) return null;

  const toggleDia = (dia) =>
    setDiasSel(prev => prev.includes(dia) ? prev.filter(d => d !== dia) : [...prev, dia]);

  const selQuick = (dias) => setDiasSel(dias);

  const diasFormatados = DIAS_SEMANA.filter(d => diasSel.includes(d)).join(', ');
  const horPresetObj   = HORARIOS_PRESET.find(h => h.id === horPreset);
  const horarioFinal   = horPreset === 'custom' ? horCustom : (horPresetObj?.value || '');

  const handleOpcao = (op) => {
    if (op.id === 'endereco') { setPasso('endereco'); return; }
    onConfirmar(medico, op);
  };

  const handleSubmit = () => {
    if (!nomeRua.trim() || !numEnd.trim() || diasSel.length === 0 || !bairroEnd.trim() || !cidadeEnd.trim()) return;
    const endereco = `${tipoLog} ${nomeRua.trim()}, ${numEnd.trim()}${compEnd.trim() ? ` — ${compEnd.trim()}` : ''}`;
    onAdicionarLocal(medico, {
      endereco,
      dias: diasFormatados,
      horario: horarioFinal || 'A confirmar',
      telefone: telefoneEnd.trim() || null,
      secretaria: secretariaEnd.trim() || null,
      bairro: bairroEnd.trim(),
      cidade: cidadeEnd.trim(),
    });
  };

  const onTouchStart = (e) => {
    const t = e.touches[0];
    touchRef.current = { startX: t.clientX, startY: t.clientY, lockH: false, lockV: false };
    setIsDragging(true);
  };

  const onTouchMove = (e) => {
    const t = e.touches[0];
    const dx = t.clientX - touchRef.current.startX;
    const dy = t.clientY - touchRef.current.startY;
    const ref = touchRef.current;
    if (!ref.lockH && !ref.lockV) {
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) ref.lockH = true;
      else if (Math.abs(dy) > 8) ref.lockV = true;
    }
    if (ref.lockH) setSwipeX(dx);
  };

  const onTouchEnd = () => {
    setIsDragging(false);
    if (Math.abs(swipeX) > 100) {
      setSwipeX(swipeX > 0 ? 600 : -600);
      setTimeout(onFechar, 260);
    } else {
      setSwipeX(0);
    }
  };

  const sheetStyle = {
    transform: `translateX(${swipeX}px)`,
    opacity: swipeX !== 0 ? Math.max(0.35, 1 - Math.abs(swipeX) / 250) : 1,
    transition: isDragging ? 'none' : 'transform 0.28s cubic-bezier(0.32,0.72,0,1), opacity 0.22s ease',
  };

  return (
    <>
      <div className="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm anim-overlay" onClick={onFechar} />
      <div className="fixed inset-x-0 bottom-0 z-50 max-w-lg mx-auto anim-sheet"
        style={sheetStyle}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >

/* Toast de desfazer com countdown, swipe e botão fechar */
function UndoToast({ undoInfo, onDesfazer, onFechar }) {
  const [seg, setSeg]           = useState(60);
  const [dragX, setDragX]       = useState(0);
  const [dragging, setDragging] = useState(false);
  const startXRef               = useRef(null);

  useEffect(() => {
    if (!undoInfo) { setDragX(0); return; }
    setSeg(60);
    const iv = setInterval(() => setSeg(s => {
      if (s <= 1) { clearInterval(iv); return 0; }
      return s - 1;
    }), 1000);
    return () => clearInterval(iv);
  }, [undoInfo && undoInfo.reporteId]);

  if (!undoInfo) return null;

  const onTouchStart = (e) => {
    startXRef.current = e.touches[0].clientX;
    setDragging(true);
  };

  const onTouchMove = (e) => {
    if (startXRef.current === null) return;
    setDragX(e.touches[0].clientX - startXRef.current);
  };

  const onTouchEnd = () => {
    setDragging(false);
    startXRef.current = null;
    if (Math.abs(dragX) > 90) {
      setDragX(dragX > 0 ? 500 : -500);
      setTimeout(onFechar, 220);
    } else {
      setDragX(0);
    }
  };

  const opacity = Math.max(0, 1 - Math.abs(dragX) / 180);

  return (
    <div
      className="fixed bottom-24 inset-x-4 z-50 max-w-lg mx-auto pointer-events-auto anim-slide-up"
      style={{
        transform: `translateX(${dragX}px)`,
        opacity,
        transition: dragging ? 'none' : 'transform 0.25s cubic-bezier(0.32,0.72,0,1), opacity 0.25s ease',
      }}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
    >
      <div className="bg-gray-900 text-white rounded-2xl px-4 py-3 shadow-2xl flex items-center gap-3">
        <i className="mdi mdi-check-circle text-emerald-400 text-xl shrink-0" aria-hidden="true" />
        <div className="flex-1 min-w-0">
          <p className="text-[11px] font-semibold text-gray-400">Reporte enviado</p>
          <p className="text-sm font-bold truncate">{undoInfo.label}</p>
        </div>
        <span className="text-xs text-gray-500 font-mono tabular-nums shrink-0">{seg}s</span>
        <button onClick={onDesfazer}
          className="bg-white text-gray-900 font-bold text-xs px-3 py-1.5 rounded-xl shrink-0 active:scale-95 transition-transform">
          Desfazer
        </button>
        <button onClick={onFechar} className="text-gray-600 hover:text-white transition-colors shrink-0" aria-label="Fechar">
          <i className="mdi mdi-close text-lg" aria-hidden="true" />
        </button>
      </div>
    </div>
  );
}

function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const toggle = (v) => onChange(selected.includes(v) ? selected.filter(x => x !== v) : [...selected, v]);
  const labelText = selected.length === 0 ? label : `${label}: ${selected.length} selecionada${selected.length > 1 ? 's' : ''}`;

  return (
    <div ref={ref} className="relative">
      <button type="button" onClick={() => setOpen(v => !v)}
        className={`w-full flex items-center justify-between gap-2 px-3 py-2 rounded-xl border-2 text-sm font-semibold transition-all ${selected.length > 0 ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-gray-200 bg-white text-gray-500 hover:border-emerald-300'}`}>
        <span className="truncate">{labelText}</span>
        <i className={`mdi mdi-chevron-${open ? 'up' : 'down'} text-lg shrink-0`} aria-hidden="true" />
      </button>
      {open && (
        <div className="absolute top-full left-0 right-0 z-50 mt-1 bg-white border border-gray-200 rounded-xl shadow-lg max-h-52 overflow-y-auto">
          {options.map(opt => {
            const sel = selected.includes(opt);
            return (
              <button key={opt} type="button" onClick={() => toggle(opt)}
                className={`w-full flex items-center gap-2.5 px-3 py-2.5 text-sm text-left hover:bg-gray-50 transition-colors ${sel ? 'font-bold text-emerald-700' : 'text-gray-700'}`}>
                <i className={`mdi ${sel ? 'mdi-checkbox-marked text-emerald-500' : 'mdi-checkbox-blank-outline text-gray-300'} text-lg shrink-0`} aria-hidden="true" />
                {opt}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   ABA ADMIN — IMPORTAÇÃO DE MÉDICOS
───────────────────────────────────────────── */
function AbaAdmin() {
  const [etapa, setEtapa]       = useState('upload');   // 'upload' | 'preview' | 'sucesso'
  const [preview, setPreview]   = useState(null);
  const [arquivo, setArquivo]   = useState(null);
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro]         = useState('');
  const [resultado, setResultado] = useState(null);
  const [filtroAdmin, setFiltroAdmin] = useState('todos'); // 'todos' | 'novos' | 'duplicados'

  const handleArquivo = async (file) => {
    if (!file) return;
    setArquivo(file);
    setErro('');
    setCarregando(true);
    try {
      const form = new FormData();
      form.append('arquivo', file);
      const res = await fetch('/api/admin/preview-importacao', { method: 'POST', body: form });
      if (!res.ok) throw new Error((await res.json()).detail || 'Erro no servidor');
      setPreview(await res.json());
      setEtapa('preview');
    } catch (e) {
      setErro(e.message || 'Erro ao processar arquivo');
    } finally {
      setCarregando(false);
    }
  };

  const handleImportar = async () => {
    setCarregando(true);
    setErro('');
    try {
      const form = new FormData();
      form.append('arquivo', arquivo);
      const res = await fetch('/api/admin/importar', { method: 'POST', body: form });
      if (!res.ok) throw new Error((await res.json()).detail || 'Erro no servidor');
      setResultado(await res.json());
      setEtapa('sucesso');
    } catch (e) {
      setErro(e.message || 'Erro ao importar');
    } finally {
      setCarregando(false);
    }
  };

  const reiniciar = () => {
    setEtapa('upload'); setPreview(null); setArquivo(null);
    setErro(''); setResultado(null); setFiltroAdmin('todos');
  };

  const medicosFiltrados = preview ? preview.medicos.filter(m =>
    filtroAdmin === 'todos' ? true : m.status === filtroAdmin
  ) : [];

  /* ── Tela de upload ── */
  if (etapa === 'upload') return (
    <main className="max-w-lg mx-auto px-4 py-6 pb-28">
      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Administração</p>
      <p className="text-xl font-black text-gray-900 mb-6">Importar médicos</p>

      <label className={`flex flex-col items-center justify-center gap-3 border-2 border-dashed rounded-2xl p-10 cursor-pointer transition-colors ${carregando ? 'border-emerald-300 bg-emerald-50' : 'border-gray-200 hover:border-emerald-300 hover:bg-emerald-50/50'}`}>
        {carregando
          ? <i className="mdi mdi-loading mdi-spin text-4xl text-emerald-400" />
          : <i className="mdi mdi-cloud-upload-outline text-4xl text-gray-300" />
        }
        <div className="text-center">
          <p className="font-bold text-gray-600 text-sm">{carregando ? 'Processando…' : 'Selecione o arquivo XLSX'}</p>
          <p className="text-xs text-gray-400 mt-0.5">Exportação "Meus Alvos" do Veeva CRM</p>
        </div>
        <input type="file" accept=".xlsx,.xls,.csv" className="hidden"
          onChange={e => handleArquivo(e.target.files[0])} disabled={carregando} />
      </label>

      {erro && <p className="mt-4 text-sm text-red-500 text-center">{erro}</p>}
    </main>
  );

  /* ── Tela de sucesso ── */
  if (etapa === 'sucesso') return (
    <main className="max-w-lg mx-auto px-4 py-6 pb-28 flex flex-col items-center gap-4">
      <div className="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mt-8">
        <i className="mdi mdi-check-circle text-4xl text-emerald-500" />
      </div>
      <p className="text-xl font-black text-gray-900">Importação concluída</p>
      <div className="w-full grid grid-cols-3 gap-3 mt-2">
        {[
          { label: 'Inseridos',  valor: resultado.inseridos, cor: 'text-emerald-600' },
          { label: 'Ignorados',  valor: resultado.ignorados, cor: 'text-gray-400'    },
          { label: 'Erros',      valor: resultado.erros,     cor: 'text-red-500'     },
        ].map(s => (
          <div key={s.label} className="bg-white rounded-2xl border border-gray-100 p-4 text-center shadow-sm">
            <p className={`text-2xl font-black ${s.cor}`}>{s.valor}</p>
            <p className="text-xs text-gray-400 mt-0.5">{s.label}</p>
          </div>
        ))}
      </div>
      <button onClick={reiniciar}
        className="mt-4 px-6 py-3 rounded-2xl bg-emerald-600 text-white font-bold text-sm">
        Nova importação
      </button>
    </main>
  );

  /* ── Tela de preview ── */
  return (
    <>
      <main className="max-w-lg mx-auto px-4 py-6 pb-36">
        <div className="flex items-center gap-3 mb-5">
          <button onClick={reiniciar} className="w-8 h-8 rounded-xl bg-gray-100 flex items-center justify-center">
            <i className="mdi mdi-arrow-left text-gray-600" />
          </button>
          <div className="flex-1">
            <p className="font-black text-gray-900">{arquivo?.name}</p>
            <p className="text-xs text-gray-400">{preview.total} médico(s) encontrado(s)</p>
          </div>
        </div>

        {/* Resumo */}
        <div className="grid grid-cols-2 gap-3 mb-4">
          <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center">
            <p className="text-2xl font-black text-emerald-600">{preview.novos}</p>
            <p className="text-xs text-emerald-700 font-semibold mt-0.5">Novos</p>
          </div>
          <div className="bg-gray-50 border border-gray-200 rounded-2xl p-4 text-center">
            <p className="text-2xl font-black text-gray-400">{preview.duplicados}</p>
            <p className="text-xs text-gray-500 font-semibold mt-0.5">Já cadastrados</p>
          </div>
        </div>

        {/* Filtro da lista */}
        <div className="flex gap-2 mb-3">
          {[['todos','Todos'], ['novo','Novos'], ['duplicado','Já cadastrados']].map(([v, l]) => (
            <button key={v} onClick={() => setFiltroAdmin(v)}
              className={`px-3 py-1.5 rounded-full text-xs font-bold border-2 transition-all ${filtroAdmin === v ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-gray-500 border-gray-200'}`}>
              {l}
            </button>
          ))}
        </div>

        {/* Lista */}
        <div className="space-y-2">
          {medicosFiltrados.map((m, i) => (
            <div key={i} className="bg-white border border-gray-100 rounded-xl px-4 py-3 flex items-center gap-3 shadow-sm">
              <div className="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center shrink-0">
                <span className="text-xs font-black text-gray-500">
                  {m.nome.split(' ').filter(p => !['Dr.','Dra.','Dr','Dra'].includes(p)).slice(0,2).map(p=>p[0]).join('')}
                </span>
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold text-gray-800 truncate">{m.nome}</p>
                <p className="text-xs text-gray-400 truncate">{m.especialidade}{m.cidade ? ` · ${m.cidade}` : ''}</p>
              </div>
              <span className={`text-[10px] font-bold px-2 py-1 rounded-full shrink-0 ${m.status === 'novo' ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-400'}`}>
                {m.status === 'novo' ? 'Novo' : 'Já existe'}
              </span>
            </div>
          ))}
        </div>
      </main>

      {/* Botão fixo acima da nav */}
      {preview.novos > 0 && (
        <div className="fixed bottom-16 inset-x-0 z-20 max-w-lg mx-auto pointer-events-none">
          <div className="h-10 bg-gradient-to-t from-[#F9FAFB] to-transparent" />
          <div className="bg-[#F9FAFB] px-4 pb-3 pointer-events-auto">
            {erro && <p className="mb-2 text-xs text-red-500 text-center">{erro}</p>}
            <button onClick={handleImportar} disabled={carregando}
              className="w-full py-4 rounded-2xl bg-emerald-600 text-white font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-200 disabled:opacity-60 transition-opacity">
              {carregando
                ? <><i className="mdi mdi-loading mdi-spin text-lg" /> Importando…</>
                : <><i className="mdi mdi-cloud-upload-outline text-lg" /> Importar {preview.novos} médico{preview.novos !== 1 ? 's' : ''} novo{preview.novos !== 1 ? 's' : ''}</>
              }
            </button>
          </div>
        </div>
      )}
    </>
  );
}

/* ─────────────────────────────────────────────
   APP PRINCIPAL
───────────────────────────────────────────── */
function App() {
  const apNome = localStorage.getItem('mw_apelido');

  const [medicos, setMedicos]         = useState([]);
  const [feed, setFeed]               = useState([]);
  const [xp, setXp]                   = useState(0);
  const [apelido, setApelido]         = useState(apNome || '');
  const [showModal, setShowModal]     = useState(!apNome);
  const [carregando, setCarregando]   = useState(!!apNome);
  const [filtroStatus,         setFiltroStatus]         = useState('todos');
  const [filtroEspecialidades, setFiltroEspecialidades] = useState([]);
  const [filtroCidades,        setFiltroCidades]        = useState([]);
  const [filtroDias,           setFiltroDias]           = useState([]);
  const [showFiltros,          setShowFiltros]          = useState(false);
  const [busca, setBusca]             = useState('');
  const [buscaQ, setBuscaQ]           = useState('');
  const [medicoAtivo, setMedicoAtivo] = useState(null);
  const [notifXp, setNotifXp]         = useState(null);
  const [aba, setAba]                 = useState('medicos');
  const [feedNovos, setFeedNovos]       = useState(0);
  const [undoInfo, setUndoInfo]         = useState(null);
  const [rankingData, setRankingData]   = useState([]);
  const [rankingLoading, setRankingLoading] = useState(false);
  const [perfilData, setPerfilData]     = useState(null);

  const [destacadoId, setDestacadoId] = useState(null);

  const timerBusca       = useRef(null);
  const socketRef        = useRef(null);
  const abaRef           = useRef('medicos');
  const undoTimer        = useRef(null);
  const rankingLoadedRef = useRef(false);
  const perfilLoadedRef  = useRef(false);

  useEffect(() => {
    clearTimeout(timerBusca.current);
    timerBusca.current = setTimeout(() => setBuscaQ(busca), 300);
    return () => clearTimeout(timerBusca.current);
  }, [busca]);

  useEffect(() => {
    if (apNome) inicializar(apNome);
    return () => {
      if (socketRef.current) socketRef.current.disconnect();
      if (undoTimer.current) clearTimeout(undoTimer.current);
    };
  }, []);

  const inicializar = async (ap) => {
    setCarregando(true);
    try {
      const [medicosData, feedData, userData] = await Promise.all([
        fetch('/api/medicos').then(r => r.json()),
        fetch('/api/feed').then(r => r.json()),
        fetch('/api/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apelido: ap }),
        }).then(r => r.json()),
      ]);
      setMedicos(medicosData);
      setFeed(feedData);
      setXp(userData.xp_total);
      conectarSocket();
    } catch (e) {
      console.error('[Hermes] Erro ao carregar:', e);
    } finally {
      setCarregando(false);
    }
  };

  const conectarSocket = () => {
    if (socketRef.current) socketRef.current.disconnect();
    const socket = io();
    socketRef.current = socket;

    socket.on('status_update', ({ medicoId, status, reportadoPor }) => {
      setMedicos(prev =>
        prev.map(m => m.id === medicoId ? { ...m, status, ultimoReporte: 'agora', reportadoPor } : m)
      );
    });

    socket.on('novo_reporte', (item) => {
      new Audio('/hermes-notificacao.mp3').play().catch(() => {});
      setFeed(prev => [item, ...prev.slice(0, 19)]);
      if (abaRef.current !== 'feed') setFeedNovos(prev => prev + 1);
    });

    socket.on('local_adicionado', ({ medicoId, local }) => {
      setMedicos(prev => prev.map(m =>
        m.id === medicoId ? { ...m, locais: [local, ...m.locais] } : m
      ));
    });

    socket.on('local_pendente_criado', ({ medicoId, pendente }) => {
      setMedicos(prev => prev.map(m =>
        m.id === medicoId ? { ...m, locaisPendentes: [...(m.locaisPendentes || []), pendente] } : m
      ));
    });

    socket.on('confirmacao_adicionada', ({ medicoId, pendenteId, confirmacoes, confirmados, threshold }) => {
      setMedicos(prev => prev.map(m =>
        m.id === medicoId ? {
          ...m,
          locaisPendentes: (m.locaisPendentes || []).map(lp =>
            lp.id === pendenteId ? { ...lp, confirmacoes, confirmados, threshold } : lp
          ),
        } : m
      ));
    });

    socket.on('local_pendente_promovido', ({ medicoId, pendenteId, medicoNome, endereco }) => {
      setMedicos(prev => prev.map(m =>
        m.id === medicoId ? { ...m, locaisPendentes: (m.locaisPendentes || []).filter(lp => lp.id !== pendenteId) } : m
      ));
      new Audio('/hermes-notificacao.mp3').play().catch(() => {});
      const item = {
        id: Date.now(),
        usuario: 'Comunidade',
        medico: medicoNome,
        acao: `Endereço confirmado: ${endereco}`,
        tempo: 'agora',
        status: 'endereco',
        xp: 0,
      };
      setFeed(prev => [item, ...prev.slice(0, 19)]);
      if (abaRef.current !== 'feed') setFeedNovos(prev => prev + 1);
    });

    socket.on('reporte_desfeito', ({ reporteId }) => {
      setFeed(prev => prev.filter(f => f.id !== reporteId));
    });
  };

  const confirmarApelido = (ap) => {
    localStorage.setItem('mw_apelido', ap);
    setApelido(ap);
    setShowModal(false);
    inicializar(ap);
  };

  const trocarAba = useCallback((id) => {
    setAba(id);
    abaRef.current = id;
    if (id === 'feed') setFeedNovos(0);
    if (id === 'ranking' && !rankingLoadedRef.current) {
      rankingLoadedRef.current = true;
      setRankingLoading(true);
      fetch('/api/ranking').then(r => r.json()).then(d => { setRankingData(d); setRankingLoading(false); });
    }
    if (id === 'perfil' && !perfilLoadedRef.current && apelido) {
      perfilLoadedRef.current = true;
      fetch(`/api/usuarios/${encodeURIComponent(apelido)}`).then(r => r.json()).then(setPerfilData);
    }
  }, [apelido]);

  const irParaMedico = useCallback((nome) => {
    const m = medicos.find(m => m.nome === nome);
    if (!m) return;
    setFiltroStatus('todos');
    setFiltroEspecialidades([]);
    setFiltroCidades([]);
    setFiltroDias([]);
    setShowFiltros(false);
    setBusca('');
    setBuscaQ('');
    trocarAba('medicos');
    setDestacadoId(m.id);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const el = document.getElementById(`medico-${m.id}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
    setTimeout(() => setDestacadoId(null), 2000);
  }, [medicos, trocarAba]);

  const handleReportar = useCallback(async (medico, opcao) => {
    setMedicoAtivo(null);
    setXp(prev => prev + opcao.xp);
    setNotifXp({ xp: opcao.xp, label: opcao.label, key: Date.now() });
    try {
      const data = await fetch('/api/reportes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          medico_id: medico.id,
          usuario_apelido: apelido,
          opcao_id: opcao.id,
          opcao_label: opcao.label,
          xp: opcao.xp,
        }),
      }).then(r => r.json());

      if (undoTimer.current) clearTimeout(undoTimer.current);
      undoTimer.current = setTimeout(() => setUndoInfo(null), 60000);
      setUndoInfo({ reporteId: data.id, xp: opcao.xp, label: opcao.label });
    } catch (e) {
      console.error('[Hermes] Erro ao reportar:', e);
    }
  }, [apelido]);

  const handleAdicionarLocal = useCallback(async (medico, localData) => {
    const opcaoEndereco = OPCOES_REPORTE.find(o => o.id === 'endereco');
    setMedicoAtivo(null);
    setXp(prev => prev + opcaoEndereco.xp);
    setNotifXp({ xp: opcaoEndereco.xp, label: 'Local sugerido!', key: Date.now() });
    try {
      const [reportData, localResp] = await Promise.all([
        fetch('/api/reportes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            medico_id: medico.id,
            usuario_apelido: apelido,
            opcao_id: 'endereco',
            opcao_label: opcaoEndereco.label,
            xp: opcaoEndereco.xp,
          }),
        }).then(r => r.json()),
        fetch(`/api/medicos/${medico.id}/locais`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...localData, usuario_apelido: apelido }),
        }).then(r => r.json()),
      ]);

      if (!localResp.pendente) {
        setNotifXp({ xp: opcaoEndereco.xp, label: 'Local adicionado!', key: Date.now() });
      }

      if (undoTimer.current) clearTimeout(undoTimer.current);
      undoTimer.current = setTimeout(() => setUndoInfo(null), 60000);
      setUndoInfo({ reporteId: reportData.id, xp: opcaoEndereco.xp, label: 'Local sugerido' });
    } catch (e) {
      console.error('[Hermes] Erro ao adicionar local:', e);
    }
  }, [apelido]);

  const handleConfirmarLocal = useCallback(async (pendenteId) => {
    try {
      await fetch(`/api/locais-pendentes/${pendenteId}/confirmar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apelido }),
      });
    } catch (e) {
      console.error('[Hermes] Erro ao confirmar local:', e);
    }
  }, [apelido]);

  const fecharUndo = useCallback(() => {
    clearTimeout(undoTimer.current);
    setUndoInfo(null);
  }, []);

  const handleDesfazer = useCallback(async () => {
    if (!undoInfo) return;
    clearTimeout(undoTimer.current);
    const { reporteId, xp: xpUndo } = undoInfo;
    setXp(prev => Math.max(0, prev - xpUndo));
    setUndoInfo(null);
    try {
      await fetch(`/api/reportes/${reporteId}?apelido=${encodeURIComponent(apelido)}`, {
        method: 'DELETE',
      });
    } catch (e) {
      console.error('[Hermes] Erro ao desfazer:', e);
    }
  }, [undoInfo, apelido]);

  const contadores = useMemo(() => ({
    todos:       medicos.length,
    disponiveis: medicos.filter(m => m.status === 'disponivel').length,
    alertas:     medicos.filter(m => m.status !== 'disponivel').length,
  }), [medicos]);

  const opcoesEspecialidades = useMemo(() =>
    [...new Set(medicos.map(m => m.especialidade))].sort(), [medicos]);

  const opcoesCidades = useMemo(() =>
    [...new Set(medicos.flatMap(m => [
      ...m.locais.map(l => l.cidade),
      ...(m.locaisPendentes || []).map(l => l.cidade),
    ].filter(Boolean)))].sort(), [medicos]);

  const opcoesBairros = useMemo(() =>
    [...new Set(medicos.flatMap(m => m.locais.map(l => l.bairro).filter(Boolean)))].sort(), [medicos]);

  const totalFiltrosAtivos = filtroEspecialidades.length + filtroCidades.length + filtroDias.length;

  const toggleArr = (arr, setArr, v) =>
    setArr(prev => prev.includes(v) ? prev.filter(x => x !== v) : [...prev, v]);

  const medicosFiltrados = useMemo(() => {
    const q = buscaQ.toLowerCase();
    return medicos.filter(m => {
      const matchBusca  = !q || m.nome.toLowerCase().includes(q) || m.especialidade.toLowerCase().includes(q);
      const matchStatus =
        filtroStatus === 'todos' ||
        (filtroStatus === 'disponiveis' && m.status === 'disponivel') ||
        (filtroStatus === 'alertas'     && m.status !== 'disponivel');
      const matchEsp = filtroEspecialidades.length === 0 || filtroEspecialidades.includes(m.especialidade);
      const matchCid = filtroCidades.length === 0 ||
        m.locais.some(l => filtroCidades.includes(l.cidade)) ||
        (m.locaisPendentes || []).some(l => filtroCidades.includes(l.cidade));
      const matchDia = filtroDias.length === 0 || m.locais.some(l =>
        filtroDias.some(d => (l.dias || '').includes(d))
      );
      return matchBusca && matchStatus && matchEsp && matchCid && matchDia;
    });
  }, [medicos, buscaQ, filtroStatus, filtroEspecialidades, filtroCidades, filtroDias]);

  if (showModal)  return <ModalApelido onConfirmar={confirmarApelido} />;
  if (carregando) return <Carregando />;

  return (
    <div className="min-h-screen" style={{ background: '#F0FDF4' }}>

      {/* ── HEADER ── */}
      <header className="sticky top-0 z-30 shadow-md" style={{ background: '#065F46' }}>
        <div className="max-w-lg mx-auto px-4 pt-3 pb-2 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <img
              src="/hermes-logo.svg"
              alt="Hermes"
              className="w-9 h-9 object-contain"
              style={{ filter: 'brightness(0) invert(1)' }}
            />
            <div>
              <p className="text-white font-black text-lg leading-none tracking-tight">Hermes</p>
              <p className="text-emerald-300 text-xs font-medium leading-none mt-0.5">status em tempo real</p>
            </div>
          </div>
          <div className="flex items-center gap-1.5 bg-amber-400 px-3 py-1.5 rounded-full shadow-sm">
            <i className="mdi mdi-star text-amber-700 text-base" aria-hidden="true" />
            <span className="text-amber-900 font-black text-sm">{xp.toLocaleString('pt-BR')} XP</span>
          </div>
        </div>
        <div className="max-w-lg mx-auto px-4 pb-3">
          <div className="relative">
            <i className="mdi mdi-magnify absolute left-3 top-1/2 -translate-y-1/2 text-white/50 text-lg pointer-events-none" aria-hidden="true" />
            <input type="search" inputMode="search"
              placeholder="Buscar médico ou especialidade…"
              value={busca} onChange={e => setBusca(e.target.value)}
              className="w-full pl-9 pr-9 py-2.5 rounded-xl bg-white/10 text-white placeholder-white/40 text-sm outline-none focus:bg-white/20 transition-colors border border-white/10"
            />
            {busca && (
              <button onClick={() => { setBusca(''); setBuscaQ(''); }}
                className="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 hover:text-white">
                <i className="mdi mdi-close text-lg" aria-hidden="true" />
              </button>
            )}
          </div>
        </div>
      </header>

      {/* ── FILTROS (só na aba Médicos) ── */}
      {aba === 'medicos' && (
        <div className="sticky z-20 border-b border-gray-200 shadow-sm" style={{ top: 108, background: '#F9FAFB' }}>
          {/* Linha 1: chips de status + botão Filtros */}
          <div className="max-w-lg mx-auto px-4 py-2.5 flex gap-2 overflow-x-auto items-center">
            {FILTROS.slice(0, 1).map(f => {
              const ativo = filtroStatus === f.id;
              return (
                <button key={f.id} onClick={() => setFiltroStatus(f.id)}
                  className={`flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap shrink-0 transition-all duration-150 border-2 ${ativo ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-gray-500 border-gray-200 hover:border-emerald-300'}`}>
                  {f.label}
                  <span className={`text-xs font-black px-1.5 py-0.5 rounded-full leading-none ${ativo ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-400'}`}>
                    {contadores[f.id]}
                  </span>
                </button>
              );
            })}
            <button onClick={() => setShowFiltros(v => !v)}
              className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-sm font-bold whitespace-nowrap shrink-0 transition-all duration-150 border-2 ${showFiltros || totalFiltrosAtivos > 0 ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-gray-500 border-gray-200 hover:border-emerald-300'}`}>
              <i className="mdi mdi-tune-variant text-base" aria-hidden="true" />
              Filtros
              {totalFiltrosAtivos > 0 && (
                <span className="bg-white/20 text-white text-xs font-black px-1.5 py-0.5 rounded-full leading-none">
                  {totalFiltrosAtivos}
                </span>
              )}
            </button>
            {FILTROS.slice(1).map(f => {
              const ativo = filtroStatus === f.id;
              return (
                <button key={f.id} onClick={() => setFiltroStatus(f.id)}
                  className={`flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap shrink-0 transition-all duration-150 border-2 ${ativo ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-gray-500 border-gray-200 hover:border-emerald-300'}`}>
                  {f.label}
                  <span className={`text-xs font-black px-1.5 py-0.5 rounded-full leading-none ${ativo ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-400'}`}>
                    {contadores[f.id]}
                  </span>
                </button>
              );
            })}
          </div>

          {/* Linha 2: painel expansível */}
          {showFiltros && (
            <div className="max-w-lg mx-auto px-4 pb-3 border-t border-gray-100">
              <div className="grid grid-cols-2 gap-2 mt-3">
                <MultiSelect label="Especialidade" options={opcoesEspecialidades} selected={filtroEspecialidades} onChange={setFiltroEspecialidades} />
                <MultiSelect label="Cidade" options={opcoesCidades} selected={filtroCidades} onChange={setFiltroCidades} />
              </div>
              <div className="mt-3">
                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Dia da semana</p>
                <div className="flex flex-wrap gap-1.5">
                  {DIAS_SEMANA.map(d => {
                    const ativo = filtroDias.includes(d);
                    return (
                      <button key={d} onClick={() => toggleArr(filtroDias, setFiltroDias, d)}
                        className={`px-3 py-1 rounded-full text-xs font-bold border transition-all duration-150 ${ativo ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-gray-500 border-gray-200 hover:border-emerald-300'}`}>
                        {d}
                      </button>
                    );
                  })}
                </div>
              </div>
              {totalFiltrosAtivos > 0 && (
                <div className="mt-3 flex justify-end">
                  <button onClick={() => { setFiltroEspecialidades([]); setFiltroCidades([]); setFiltroDias([]); }}
                    className="text-xs font-bold text-gray-400 hover:text-red-500 transition-colors">
                    Limpar filtros
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* ── CONTEÚDO ── */}
      {aba === 'medicos' && (
        <main className="max-w-lg mx-auto px-4 py-4 pb-28 space-y-3">
          <FeedCompacto feed={feed} onVerFeed={() => trocarAba('feed')} onIrParaMedico={irParaMedico} />
          {buscaQ && (
            <p className="text-xs text-gray-400 px-1">
              {medicosFiltrados.length === 0
                ? `Nenhum resultado para "${buscaQ}"`
                : `${medicosFiltrados.length} resultado${medicosFiltrados.length !== 1 ? 's' : ''} para "${buscaQ}"`}
            </p>
          )}
          {medicosFiltrados.length === 0 && !buscaQ ? (
            <div className="flex flex-col items-center py-12 gap-2">
              <i className="mdi mdi-magnify text-5xl text-gray-200" aria-hidden="true" />
              <p className="font-bold text-gray-500">Nenhum médico nesta categoria</p>
            </div>
          ) : (
            medicosFiltrados.map(m => <MedicoCard key={m.id} medico={m} onReportar={setMedicoAtivo} destacado={m.id === destacadoId} apelido={apelido} onConfirmarLocal={handleConfirmarLocal} />)
          )}
        </main>
      )}

      {aba === 'feed'    && <main className="max-w-lg mx-auto px-4 py-4 pb-28"><FeedComunidade feed={feed} onIrParaMedico={irParaMedico} /></main>}
      {aba === 'ranking' && <AbaRanking data={rankingData} loading={rankingLoading} apelido={apelido} />}
      {aba === 'perfil'  && <AbaPerfil data={perfilData} apelido={apelido} xp={xp} />}
      {aba === 'admin'   && <AbaAdmin />}

      {/* ── BOTTOM NAV ── */}
      <nav className="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-gray-100 shadow-lg">
        <div className="max-w-lg mx-auto flex">
          {ABAS.map(tab => {
            const ativo = aba === tab.id;
            return (
              <button key={tab.id} onClick={() => trocarAba(tab.id)}
                className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 transition-colors relative ${ativo ? 'text-emerald-600' : 'text-gray-400'}`}>
                <span className="relative inline-block">
                  <i className={`mdi ${tab.icon} text-2xl`} aria-hidden="true" />
                  {tab.id === 'feed' && feedNovos > 0 && (
                    <span className="absolute -top-1 -right-1.5 bg-red-500 text-white text-[9px] font-black rounded-full min-w-[16px] h-4 flex items-center justify-center px-0.5 leading-none">
                      {feedNovos > 9 ? '9+' : feedNovos}
                    </span>
                  )}
                </span>
                <span className={`text-[10px] font-bold ${ativo ? 'text-emerald-600' : 'text-gray-400'}`}>{tab.label}</span>
                {ativo && <span className="absolute bottom-0 w-8 h-0.5 rounded-full bg-emerald-500" />}
              </button>
            );
          })}
        </div>
      </nav>

      <PainelReporte
        medico={medicoAtivo}
        onFechar={() => setMedicoAtivo(null)}
        onConfirmar={handleReportar}
        onAdicionarLocal={handleAdicionarLocal}
        opcoesCidades={opcoesCidades}
        opcoesBairros={opcoesBairros}
      />
      {notifXp && <XpToast notif={notifXp} onDone={() => setNotifXp(null)} />}
      <UndoToast undoInfo={undoInfo} onDesfazer={handleDesfazer} onFechar={fecharUndo} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
